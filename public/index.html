<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة مدرسة تحفيظ القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#0F2A22;
    --green-800:#1B4332;
    --green-700:#2D6A4F;
    --green-600:#3C8064;
    --green-100:#E9F3EC;
    --gold-600:#C9A227;
    --gold-500:#D6B44A;
    --gold-300:#E9D48F;
    --cream:#FBF8F1;
    --sand:#F1E9D8;
    --ink:#22281F;
    --ink-muted:#6B7060;
    --border:#E4DAB9;
    --danger:#B3261E;
    --danger-bg:#FBEAE8;
    --success:#2D6A4F;
    --white:#FFFFFF;
    --radius:14px;
    --font-display:'Amiri', serif;
    --font-body:'Tajawal', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}
  ::selection{background:var(--gold-300);}
  a{color:var(--green-700);}

  .hidden{display:none !important;}
  .btn{
    border:none;border-radius:10px;padding:11px 20px;font-size:15px;font-weight:700;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--green-800);color:var(--white);}
  .btn-primary:hover{background:var(--green-700);}
  .btn-gold{background:var(--gold-600);color:var(--green-900);}
  .btn-gold:hover{background:var(--gold-500);}
  .btn-outline{background:transparent;color:var(--green-800);border:1.5px solid var(--green-800);}
  .btn-outline:hover{background:var(--green-100);}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-danger:hover{background:#f6d9d6;}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:8px;}
  .field{margin-bottom:14px;display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;font-weight:700;color:var(--green-800);}
  .field input,.field select,.field textarea{
    padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;
    background:var(--white);color:var(--ink);outline:none;transition:border .12s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green-700);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}
  .card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
  .muted{color:var(--ink-muted);font-size:13px;}
  .tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;}
  .tag-pending{background:#FFF3D6;color:#8A6300;}
  .tag-done{background:var(--green-100);color:var(--green-800);}
  .tag-none{background:var(--sand);color:var(--ink-muted);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--border);}
  th{color:var(--green-800);font-size:12.5px;font-weight:700;background:var(--green-100);}
  tr:hover td{background:#FCFAF2;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--green-800);color:var(--white);padding:12px 22px;border-radius:10px;
    font-size:14px;font-weight:700;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.2);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .toast.err{background:var(--danger);}

  #login-screen{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;position:relative;overflow:hidden;
  }
  .login-hero{
    width:100%;max-width:420px;background:var(--green-800);border-radius:20px 20px 0 0;
    padding:34px 28px 26px;text-align:center;position:relative;overflow:hidden;color:var(--white);
  }
  .login-hero svg.pattern{position:absolute;inset:0;width:100%;height:100%;opacity:.14;}
  .school-logo{
    width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--green-700);
    border:3px solid var(--gold-500);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:30px;color:var(--gold-300);position:relative;z-index:1;
  }
  .school-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .login-hero h1{
    font-family:var(--font-display);font-size:26px;margin:0 0 4px;position:relative;z-index:1;
  }
  .login-hero p.sub{margin:0;color:var(--gold-300);font-size:13px;position:relative;z-index:1;}
  .login-card{
    width:100%;max-width:420px;background:var(--white);border-radius:0 0 20px 20px;
    padding:30px 28px;box-shadow:0 20px 50px rgba(15,42,34,.14);
  }
  .login-contacts{
    display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;margin-top:16px;position:relative;z-index:1;
  }
  .login-contacts a, .login-contacts span{
    color:var(--gold-300);text-decoration:none;font-size:12.5px;display:flex;align-items:center;gap:5px;
  }
  .login-contacts a:hover{color:var(--white);}
  .login-footer-note{text-align:center;margin-top:14px;font-size:12px;color:var(--ink-muted);}
  .role-badge-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px;}
  .role-chip{
    background:var(--green-100);color:var(--green-800);font-size:11.5px;font-weight:700;
    padding:5px 11px;border-radius:20px;
  }
  .error-msg{
    background:var(--danger-bg);color:var(--danger);padding:9px 12px;border-radius:8px;font-size:13px;
    margin-bottom:14px;font-weight:700;text-align:center;
  }

  #app-shell{display:none;min-height:100vh;}
  #app-shell.active{display:flex;}
  .topbar{
    position:fixed;top:0;right:0;left:0;height:64px;background:var(--white);border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:50;
  }
  .topbar-brand{display:flex;align-items:center;gap:10px;}
  .topbar-brand .logo-sm{
    width:38px;height:38px;border-radius:50%;background:var(--green-800);color:var(--gold-300);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px;overflow:hidden;
  }
  .topbar-brand .logo-sm img{width:100%;height:100%;object-fit:cover;}
  .topbar-brand .school-name{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--green-800);}
  .topbar-user{display:flex;align-items:center;gap:12px;}
  .topbar-user .who{font-size:13px;text-align:left;}
  .topbar-user .who b{display:block;color:var(--green-800);font-size:13.5px;}
  .topbar-user .who span{color:var(--ink-muted);font-size:11.5px;}
  .avatar{
    width:36px;height:36px;border-radius:50%;background:var(--gold-500);color:var(--green-900);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
  }
  .sidebar{
    position:fixed;top:64px;right:0;bottom:0;width:220px;background:var(--green-900);
    padding:18px 12px;overflow-y:auto;z-index:40;
  }
  .sidebar button{
    width:100%;text-align:right;background:transparent;border:none;color:#CFE0D6;
    padding:11px 14px;border-radius:9px;font-size:14px;margin-bottom:4px;display:flex;
    align-items:center;justify-content:space-between;font-weight:500;
  }
  .sidebar button:hover{background:rgba(255,255,255,.06);color:var(--white);}
  .sidebar button.active{background:var(--gold-600);color:var(--green-900);font-weight:700;}
  main{margin-right:220px;margin-top:64px;padding:26px 30px;flex:1;width:calc(100% - 220px);min-height:calc(100vh - 64px);}
  @media(max-width:900px){
    .sidebar{width:180px;}
    main{margin-right:180px;width:calc(100% - 180px);}
  }
  @media(max-width:680px){
    .sidebar{position:fixed;top:64px;right:0;left:0;width:100%;height:auto;display:flex;overflow-x:auto;padding:8px;gap:4px;}
    .sidebar button{width:auto;white-space:nowrap;margin-bottom:0;}
    main{margin-right:0;width:100%;margin-top:120px;padding:16px;}
  }
  .page-title{font-family:var(--font-display);font-size:24px;color:var(--green-800);margin:0 0 4px;}
  .page-sub{color:var(--ink-muted);font-size:13.5px;margin:0 0 22px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .empty-state{
    text-align:center;padding:50px 20px;color:var(--ink-muted);
  }
  .empty-state .icon{font-size:34px;margin-bottom:8px;}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .stat-card .num{font-family:var(--font-display);font-size:26px;color:var(--green-800);font-weight:700;}
  .stat-card .lbl{font-size:12.5px;color:var(--ink-muted);}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,42,34,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-box{background:var(--white);border-radius:16px;padding:26px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal-box h3{font-family:var(--font-display);color:var(--green-800);margin-top:0;}
  .badge-role{padding:2px 9px;border-radius:8px;font-size:11px;font-weight:700;}
  .badge-admin{background:#F4E3D3;color:#8A4B00;}
  .badge-teacher{background:var(--green-100);color:var(--green-800);}
  .badge-exam{background:#E4E9FA;color:#3949AB;}
  .badge-parent{background:#FBEAE8;color:#A83A32;}

  .chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 160px);background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .chat-messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--cream);}
  .msg{max-width:70%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;position:relative;}
  .msg.mine{align-self:flex-start;background:var(--green-800);color:var(--white);border-bottom-left-radius:2px;}
  .msg.theirs{align-self:flex-end;background:var(--white);border:1px solid var(--border);border-bottom-right-radius:2px;}
  .msg .meta{font-size:11px;opacity:.75;margin-bottom:3px;display:flex;gap:6px;align-items:center;}
  .chat-input-row{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border);background:var(--white);}
  .chat-input-row input{flex:1;padding:11px 14px;border-radius:24px;border:1.5px solid var(--border);font-size:14px;}
  .chat-input-row button{border-radius:24px;padding:10px 22px;}
  @media(max-width:680px){.msg{max-width:88%;}}
  .chat-layout{display:flex;gap:16px;height:calc(100vh - 160px);}
  .chat-contacts{width:230px;flex-shrink:0;overflow-y:auto;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:10px;}
  .chat-contact{
    width:100%;text-align:right;background:transparent;border:none;padding:10px 12px;border-radius:9px;
    margin-bottom:3px;font-size:13.5px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  }
  .chat-contact .cname{font-weight:700;color:var(--ink);}
  .chat-contact .crole{font-size:11px;color:var(--ink-muted);}
  .chat-contact:hover{background:var(--green-100);}
  .chat-contact.active{background:var(--green-800);}
  .chat-contact.active .cname{color:var(--white);}
  .chat-contact.active .crole{color:var(--gold-300);}
  .chat-divider{font-size:11px;color:var(--ink-muted);padding:8px 10px 4px;font-weight:700;}
  @media(max-width:768px){.chat-layout{flex-direction:column;height:auto;}.chat-contacts{width:100%;display:flex;overflow-x:auto;gap:4px;padding:8px;}.chat-contact{width:auto;white-space:nowrap;flex-direction:row;}.chat-wrap{height:60vh;}}
  .att-table th, .att-table td{text-align:center;}
  .filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .filter-bar select, .filter-bar input{
    padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13.5px;background:var(--white);color:var(--ink);
  }
  .filter-bar input{flex:1;min-width:160px;}
  .absentee-pill{
    display:inline-block;background:var(--danger-bg);color:var(--danger);font-size:12.5px;font-weight:700;
    padding:6px 12px;border-radius:20px;margin:0 6px 6px 0;
  }
  .att-matrix-wrap{overflow-x:auto;}
  table.att-matrix{border-collapse:collapse;font-size:12.5px;white-space:nowrap;}
  table.att-matrix th, table.att-matrix td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--border);}
  table.att-matrix th{position:sticky;top:0;background:var(--green-100);color:var(--green-800);}
  table.att-matrix td:first-child, table.att-matrix th:first-child{
    position:sticky;right:0;background:var(--white);text-align:right;font-weight:700;z-index:2;box-shadow:-4px 0 4px -4px rgba(0,0,0,.08);
  }
  table.att-matrix th:first-child{background:var(--green-100);z-index:3;}
  .att-cell-present{color:var(--success);font-weight:700;background:#EFF8F2;}
  .att-cell-absent{color:var(--danger);font-weight:700;background:var(--danger-bg);}
  .att-cell-none{color:var(--ink-muted);}
  .loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:300;display:none;align-items:center;justify-content:center;}
  .loading-overlay.active{display:flex;}
  .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--green-800);border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="toast" class="toast"></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<div id="login-screen">
  <svg viewBox="0 0 100 100" style="display:none"></svg>
  <div class="login-hero">
    <svg class="pattern" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="star8" width="34" height="34" patternUnits="userSpaceOnUse">
          <g fill="none" stroke="#D6B44A" stroke-width="1">
            <path d="M17 2 L21 13 L32 17 L21 21 L17 32 L13 21 L2 17 L13 13 Z"/>
          </g>
        </pattern>
      </defs>
      <rect width="200" height="200" fill="url(#star8)"/>
    </svg>
    <div class="school-logo" id="login-logo-box">ق</div>
    <h1 id="login-school-name">مدرسة تحفيظ القرآن الكريم</h1>
    <p class="sub" id="login-school-tagline">نظام إدارة الطلاب والحفظ والاختبارات</p>
    <div class="login-contacts" id="login-contacts"></div>
  </div>
  <div class="login-card">
    <div id="login-error" class="error-msg hidden"></div>
    <div class="field">
      <label>اسم المستخدم</label>
      <input type="text" id="login-username" placeholder="أدخل اسم المستخدم" autocomplete="username">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="login-password" placeholder="أدخل كلمة المرور" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" style="width:100%;padding:13px;font-size:15px;" onclick="handleLogin()">تسجيل الدخول</button>
    <div class="role-badge-row">
      <span class="role-chip">إدارة</span><span class="role-chip">محفّظ</span>
      <span class="role-chip">لجنة اختبارات</span><span class="role-chip">ولي أمر</span>
    </div>
    <p class="login-footer-note">لكل مستخدم اسم دخول وكلمة سر خاصة به. للحصول على حساب تواصل مع إدارة المدرسة.</p>
  </div>
</div>

<div id="app-shell">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="logo-sm" id="top-logo-box">ق</div>
      <div class="school-name" id="top-school-name">مدرسة تحفيظ القرآن الكريم</div>
    </div>
    <div class="topbar-user">
      <div class="who"><b id="top-user-name"></b><span id="top-user-role"></span></div>
      <div class="avatar" id="top-avatar">?</div>
      <button class="btn btn-outline btn-sm" onclick="handleLogout()">تسجيل الخروج</button>
    </div>
  </div>
  <div class="sidebar" id="sidebar"></div>
  <main id="main-content"></main>
</div>

<script>
const API_BASE = '';
let authToken = localStorage.getItem('token') || null;

async function api(method, endpoint, body = null) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' }
  };
  if (authToken) opts.headers['Authorization'] = 'Bearer ' + authToken;
  if (body) opts.body = JSON.stringify(body);

  const res = await fetch((API_BASE || window.location.origin) + endpoint, opts);
  if (res.status === 401) {
    localStorage.removeItem('token');
    authToken = null;
    showLoginScreen();
    throw new Error('Session expired');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function setLoading(show) {
  document.getElementById('loading').classList.toggle('active', show);
}

let DATA = { school: {}, users: [], students: [], messages: [] };
let currentUser = null;
let currentRoute = null;
let chatPollTimer = null;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.className='toast', 2400);
}

async function loadAll(){
  try {
    setLoading(true);
    const [school, users, students] = await Promise.all([
      api('GET', '/api/school'),
      api('GET', '/api/users'),
      api('GET', '/api/students')
    ]);
    DATA.school = school || {};
    DATA.users = users || [];
    DATA.students = students || [];
    renderBranding();
    setLoading(false);
  } catch(e) {
    setLoading(false);
    console.error(e);
  }
}

function renderBranding(){
  const s = DATA.school;
  document.getElementById('login-school-name').textContent = s.name || 'مدرسة تحفيظ القرآن الكريم';
  document.getElementById('login-school-tagline').textContent = s.tagline || '';
  document.getElementById('top-school-name').textContent = s.name || 'مدرسة تحفيظ القرآن الكريم';
  const initials = (s.name||'ق').trim().charAt(0);
  const loginLogoBox = document.getElementById('login-logo-box');
  const topLogoBox = document.getElementById('top-logo-box');
  if(s.logo){
    loginLogoBox.innerHTML = `<img src="${s.logo}" alt="شعار">`;
    topLogoBox.innerHTML = `<img src="${s.logo}" alt="شعار">`;
  }else{
    loginLogoBox.textContent = initials;
    topLogoBox.textContent = initials;
  }
  const contacts = [];
  if(s.phone) contacts.push(`<a href="tel:${esc(s.phone)}">📞 ${esc(s.phone)}</a>`);
  if(s.whatsapp) contacts.push(`<a href="https://wa.me/${esc(s.whatsapp.replace(/[^0-9]/g,''))}" target="_blank">💬 واتساب</a>`);
  if(s.whatsapp_group) contacts.push(`<a href="${esc(s.whatsapp_group)}" target="_blank">👥 مجموعة الطلاب</a>`);
  if(s.facebook) contacts.push(`<a href="${esc(s.facebook)}" target="_blank">فيسبوك</a>`);
  if(s.instagram) contacts.push(`<a href="${esc(s.instagram)}" target="_blank">إنستغرام</a>`);
  document.getElementById('login-contacts').innerHTML = contacts.join('');
}

/* =========================================================
   AUTH
========================================================= */
async function handleLogin(){
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  const errBox = document.getElementById('login-error');
  errBox.classList.add('hidden');
  if(!u || !p){ errBox.textContent='الرجاء إدخال اسم المستخدم وكلمة المرور'; errBox.classList.remove('hidden'); return; }

  try {
    setLoading(true);
    const data = await api('POST', '/api/auth/login', { username: u, password: p });
    authToken = data.token;
    localStorage.setItem('token', authToken);
    currentUser = data.user;
    currentUser.studentId = data.user.studentId;
    setLoading(false);

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-shell').classList.add('active');
    document.getElementById('top-user-name').textContent = currentUser.name;
    document.getElementById('top-user-role').textContent = roleLabel(currentUser.role);
    updateTopbarAvatar();
    buildSidebar();
    await loadAll();

function studentsMiniTable(list){

}

function examTag(status){
  if(status==='pending') return `<span class="tag tag-pending">بانتظار الاختبار</span>`;
  if(status==='done') return `<span class="tag tag-done">تم الاختبار</span>`;

}

async function handleLogoUpload(input){
  const file = input.files[0];
  if(!file) return;
  const formData = new FormData();
  formData.append('image', file);
  try {
    setLoading(true);
    const res = await fetch((API_BASE || window.location.origin) + '/api/upload', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + authToken },
      body: formData
    });
    const data = await res.json();
    setLoading(false);
    if (data.url) {
      document.getElementById('logo-preview').innerHTML = `<img src="${data.url}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid var(--gold-500);">`;
      document.getElementById('logo-preview').dataset.value = data.url;
    }
  } catch(e) {
    setLoading(false);
    showToast('فشل رفع الصورة', true);
  }
}

async function saveSchoolInfoForm(){
  const payload = {
    name: document.getElementById('sc-name').value.trim() || 'مدرسة تحفيظ القرآن الكريم',
    tagline: document.getElementById('sc-tagline').value.trim(),
    phone: document.getElementById('sc-phone').value.trim(),
    whatsapp: document.getElementById('sc-whatsapp').value.trim(),
    facebook: document.getElementById('sc-fb').value.trim(),
    instagram: document.getElementById('sc-ig').value.trim(),
    whatsapp_group: document.getElementById('sc-wgroup').value.trim()
  };
  const logoPreview = document.getElementById('logo-preview');
  if(logoPreview && logoPreview.dataset.value) payload.logo = logoPreview.dataset.value;

  try {
    setLoading(true);
    DATA.school = await api('PUT', '/api/school', payload);
    setLoading(false);
    renderBranding();
    showToast('تم حفظ معلومات المدرسة');
  } catch(e) {
    setLoading(false);
    showToast(e.message, true);
  }
}

function closeModal(id){ const m=document.getElementById(id); if(m) m.remove(); }

async function createUser(){
  const name = document.getElementById('nu-name').value.trim();
  const username = document.getElementById('nu-username').value.trim();
  const password = document.getElementById('nu-password').value;
  const role = document.getElementById('nu-role').value;
  if(!name || !username || !password){ showToast('الرجاء تعبئة جميع الحقول', true); return; }

  const payload = { name, username, password, role };
  if(role==='parent'){
    const sid = document.getElementById('nu-student').value;
    if(!sid){ showToast('الرجاء اختيار الطالب المرتبط', true); return; }
    payload.student_id = sid;
  }

  try {
    setLoading(true);
    await api('POST', '/api/users', payload);
    DATA.users = await api('GET', '/api/users');
    setLoading(false);
    closeModal('user-modal');
    showToast('تم إنشاء المستخدم بنجاح');
    renderAdminUsers();
  } catch(e) {
    setLoading(false);
    showToast(e.message, true);
  }
}

async function deleteUser(id){
  if(!confirm('هل أنت متأكد من حذف هذا المستخدم؟')) return;
  try {
    setLoading(true);
    await api('DELETE', '/api/users/' + id);
    DATA.users = await api('GET', '/api/users');
    setLoading(false);
    renderAdminUsers();
    showToast('تم حذف المستخدم');
  } catch(e) {
    setLoading(false);
    showToast(e.message, true);
  }
}

function renderAdminAbsentToday(){

  const absent = DATA.students.filter(s => s.attendance && s.attendance[today] === 'absent');
  const box = document.getElementById('adm-absent-today');
  box.innerHTML = absent.length
    ? absent.map(s=>`<span class="absentee-pill">🔴 ${esc(s.full_name)} · ${esc(s.teacher_name)}</span>`).join('')
    : `<p class="muted">لا يوجد غياب مسجل اليوم بعد.</p>`;
}

function lastNDates(n){
  const arr = [];
  const d = new Date();
  for(let i=0;i<n;i++){
    arr.push(new Date(d.getFullYear(), d.getMonth(), d.getDate()-i).toISOString().slice(0,10));
  }
  return arr;
}

function renderAdminAttendanceMatrix(){
  const teacherId = document.getElementById('adm-att-filter').value;
  const days = parseInt(document.getElementById('adm-att-days').value, 10);
  let list = DATA.students;
  if(teacherId) list = list.filter(s=>s.teacher_id===teacherId);
  const dates = lastNDates(days);
  const box = document.getElementById('adm-att-matrix');
  if(!list.length){ box.innerHTML = `<p class="muted">لا يوجد طلاب لعرضهم.</p>`; return; }
  box.innerHTML = `<table class="att-matrix"><thead><tr>
    <th>الطالب</th>${dates.map(d=>`<th>${esc(d.slice(5))}</th>`).join('')}
  </tr></thead><tbody>
  ${list.map(s=>`<tr><td>${esc(s.full_name)}</td>${dates.map(d=>{
    const st = s.attendance ? s.attendance[d] : null;
    if(st==='present') return `<td class="att-cell-present">✓</td>`;
    if(st==='absent') return `<td class="att-cell-absent">✗</td>`;
    return `<td class="att-cell-none">—</td>`;
  }).join('')}</tr>`).join('')}
  </tbody></table>`;
}

async function saveStudentForm(existingId){
  const full_name = document.getElementById('st-fullName').value.trim();
  const national_id = document.getElementById('st-nationalId').value.trim();
  if(!full_name || !national_id){ showToast('الاسم الرباعي ورقم الهوية مطلوبان', true); return; }

  const payload = {
    full_name, national_id,
    father_national_id: document.getElementById('st-fatherNationalId').value.trim(),
    phone: document.getElementById('st-phone').value.trim(),
    age: document.getElementById('st-age').value.trim(),
    birth_date: document.getElementById('st-birthDate').value,
    last_memorization: document.getElementById('st-lastMemorization').value.trim(),
    level: document.getElementById('st-level').value,
  };

  try {
    setLoading(true);
    if(existingId){
      await api('PUT', '/api/students/' + existingId, payload);
    } else {
      await api('POST', '/api/students', payload);
    }
    DATA.students = await api('GET', '/api/students');
    setLoading(false);
    showToast('تم حفظ بيانات الطالب');
    navigate('teacher-students');
  } catch(e) {
    setLoading(false);

function renderAttendanceList(){

  if(!list.length){ box.innerHTML = `<p class="muted">لا يوجد طلاب لتسجيل حضورهم.</p>`; return; }
  box.innerHTML = list.map(s=>{
    const status = (s.attendance && s.attendance[date]) || '';
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">

async function saveAttendance(){
  const date = document.getElementById('att-date').value;
  if(!date){ showToast('الرجاء اختيار التاريخ', true); return; }

  try {
    setLoading(true);
    for (const s of myStudents()) {
      const checked = document.querySelector(`input[name="att_${s.id}"]:checked`);
      if(checked){
        const attendance = { ...s.attendance, [date]: checked.value };
        await api('PUT', '/api/students/' + s.id, { attendance });
      }
    }
    DATA.students = await api('GET', '/api/students');
    setLoading(false);
    showToast('تم حفظ سجل الحضور');
  } catch(e) {
    setLoading(false);
    showToast(e.message, true);
  }
}

async function handleAvatarUpload(input){
  const file = input.files[0];
  if(!file) return;
  const formData = new FormData();
  formData.append('image', file);
  try {
    setLoading(true);
    const res = await fetch((API_BASE || window.location.origin) + '/api/upload', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + authToken },
      body: formData
    });
    const data = await res.json();
    setLoading(false);
    if (data.url) {
      document.getElementById('profile-avatar-preview').innerHTML = `<img src="${data.url}" style="width:100%;height:100%;object-fit:cover;">`;
      document.getElementById('profile-avatar-preview').dataset.value = data.url;
    }
  } catch(e) {
    setLoading(false);
    showToast('فشل رفع الصورة', true);
  }
}

async function saveProfile(){
  const name = document.getElementById('pf-name').value.trim();
  if(!name){ showToast('الاسم مطلوب', true); return; }
  const password = document.getElementById('pf-password').value;
  const preview = document.getElementById('profile-avatar-preview');

  const payload = { name };
  if(password) payload.password = password;
  if(preview && preview.dataset.value) payload.avatar = preview.dataset.value;

  try {
    setLoading(true);
    const updated = await api('PUT', '/api/users/' + currentUser.id, payload);
    currentUser = { ...currentUser, ...updated };
    setLoading(false);
    document.getElementById('top-user-name').textContent = currentUser.name;
    updateTopbarAvatar();
    document.getElementById('pf-password').value = '';
    showToast('تم حفظ ملفك الشخصي');
  } catch(e) {
    setLoading(false);
    showToast(e.message, true);
  }
}

/* =========================================================
   PRIVATE MESSAGES
========================================================= */
let activeThreadUserId = null;
function dmChannel(idA, idB){ return 'dm:' + [idA, idB].sort().join('_'); }

function renderMessages(){
  const others = DATA.users.filter(u=>u.id!==currentUser.id);
  activeThreadUserId = others.length ? (activeThreadUserId || others[0].id) : null;
  setMain(`
    <h1 class="page-title">الرسائل الخاصة</h1>
    <p class="page-sub">محادثة خاصة مباشرة بينك وبين أي مستخدم آخر</p>
    <div class="chat-layout">
      <div class="chat-contacts" id="dm-contacts-list">
        ${others.length ? others.map(u=>`
          <button class="chat-contact ${u.id===activeThreadUserId?'active':''}" onclick="selectThread('${u.id}')">
            <span class="cname">${esc(u.name)}</span>
            <span class="crole">${roleLabel(u.role)}</span>
          </button>
        `).join('') : `<p class="muted" style="padding:10px;">لا يوجد مستخدمون آخرون بعد</p>`}
      </div>
      <div class="chat-wrap" style="flex:1;">
        <div class="chat-messages" id="dm-messages"></div>
        <div class="chat-input-row">
          <input id="dm-input" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter') sendPrivateMessage()">
          <button class="btn btn-primary" onclick="sendPrivateMessage()">إرسال</button>
        </div>
      </div>
    </div>
  `);
  if(activeThreadUserId){
    refreshThread();
    chatPollTimer = setInterval(refreshThread, 5000);
  }
}

function selectThread(userId){
  activeThreadUserId = userId;
  renderMessages();
}

async function refreshThread(){
  if(!activeThreadUserId) return;
  try {
    const thread = await api('GET', '/api/messages?with=' + activeThreadUserId);
    const box = document.getElementById('dm-messages');
    if(!box) return;
    const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    box.innerHTML = thread.length ? thread.map(m=>`
      <div class="msg ${m.sender_id===currentUser.id?'mine':'theirs'}">
        <div class="meta"><b>${esc(m.sender_name)}</b> · ${esc(m.time)}</div>
        ${esc(m.text)}
      </div>
    `).join('') : `<p class="muted" style="text-align:center;">لا توجد رسائل بعد، ابدأ المحادثة</p>`;
    if(wasAtBottom || thread.length<=1) box.scrollTop = box.scrollHeight;
  } catch(e) {
    console.error(e);
  }
}

async function sendPrivateMessage(){
  if(!activeThreadUserId) return;
  const input = document.getElementById('dm-input');
  const text = input.value.trim();
  if(!text) return;
  const other = DATA.users.find(u=>u.id===activeThreadUserId);

  try {
    await api('POST', '/api/messages', {
      recipient_id: activeThreadUserId,
      recipient_name: other ? other.name : '',
      text
    });
    input.value = '';
    refreshThread();
  } catch(e) {
    showToast(e.message, true);
  }
}

/* =========================================================
   GROUP CHAT
========================================================= */
function renderChat(){
  setMain(`
    <h1 class="page-title">الدردشة العامة</h1>
    <p class="page-sub">محادثة تجمع الإدارة والمحفّظين ولجنة الاختبارات وأولياء الأمور</p>
    <div class="chat-wrap">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <input id="chat-input" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter') sendChatMessage()">
        <button class="btn btn-primary" onclick="sendChatMessage()">إرسال</button>
      </div>
    </div>
  `);
  refreshChat();
  chatPollTimer = setInterval(refreshChat, 5000);
}

async function refreshChat(){
  try {
    const groupMsgs = await api('GET', '/api/messages?channel=group');
    const box = document.getElementById('chat-messages');
    if(!box) return;
    const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    box.innerHTML = groupMsgs.length ? groupMsgs.map(m=>`
      <div class="msg ${m.sender_id===currentUser.id?'mine':'theirs'}">
        <div class="meta"><b>${esc(m.sender_name)}</b> · ${roleLabel(m.sender_role)} · ${esc(m.time)}</div>
        ${esc(m.text)}
      </div>
    `).join('') : `<p class="muted" style="text-align:center;">لا توجد رسائل بعد، ابدأ المحادثة</p>`;
    if(wasAtBottom || groupMsgs.length<=1) box.scrollTop = box.scrollHeight;
  } catch(e) {
    console.error(e);
  }
}

async function sendChatMessage(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;

  try {
    await api('POST', '/api/messages', { channel: 'group', text });
    input.value = '';
    refreshChat();
  } catch(e) {
    showToast(e.message, true);
  }
}

/* =========================================================
   INIT
========================================================= */
(async function init(){
  if(authToken) {
    try {
      setLoading(true);
      const user = await api('GET', '/api/auth/me');
      currentUser = user;
      currentUser.studentId = user.student_id;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-shell').classList.add('active');
      document.getElementById('top-user-name').textContent = user.name;
      document.getElementById('top-user-role').textContent = roleLabel(user.role);
      updateTopbarAvatar();
      buildSidebar();
      await loadAll();
      navigate(defaultRouteFor(user.role));
      setLoading(false);
    } catch(e) {
      setLoading(false);
      localStorage.removeItem('token');
      authToken = null;
      showLoginScreen();
    }
  } else {
    try {
      const school = await api('GET', '/api/school');
      DATA.school = school || {};
      renderBranding();
    } catch(e) {
      console.error(e);
    }
  }
})();
</script>
